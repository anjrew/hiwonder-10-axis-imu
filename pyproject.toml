[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiwonder-10-axis-imu"
version = "0.1.0"
description = "Read a Hiwonder 10-axis IMU over USB serial from macOS or Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew Johnson", email = "andrewmjohnson549@gmail.com" }]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hiwonder-imu = "hiwonder_imu.cli:main"

[project.urls]
Homepage = "https://github.com/anjrew/hiwonder-10-axis-imu"

[tool.setuptools]
packages = ["hiwonder_imu"]

[tool.setuptools.package-data]
hiwonder_imu = ["web/*.html"]
